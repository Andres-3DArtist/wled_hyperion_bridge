name: Feature request
description: Suggest an idea for the integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What itch does this scratch? What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it behave? Per-bridge or global? WLED side, Hyperion side, or UI?
