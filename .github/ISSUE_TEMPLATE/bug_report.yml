name: Bug report
description: Report a problem with the integration
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Integration version
      description: e.g. 1.4.1 (see HACS or manifest.json)
      placeholder: 1.4.1
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: e.g. 2026.9.4 (Settings > System > About)
      placeholder: 2026.9.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Settings > System > Logs. Redact tokens and internal hostnames.
      render: text
